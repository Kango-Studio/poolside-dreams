name: Supabase keep-alive

# Free Supabase projects are paused after 7 days without activity. This job
# runs one tiny read query against the database every day so the project
# never goes idle. It can also be triggered by hand from the Actions tab.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the project's public anon key

on:
  schedule:
    - cron: "17 9 * * *" # every day at 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          # Reads one row of public.posts (anon can read published posts), which
          # runs a real query against the Postgres database.
          status=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 20 \
            "${SUPABASE_URL%/}/rest/v1/posts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase responded with HTTP ${status}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Supabase keep-alive query failed (HTTP ${status})."
            exit 1
          fi
